name: Release

on:
    push:
        tags:
            - "*.*.*"

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"
            - run: npm ci
            - run: npm run build

            - name: Upload release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release upload "$tag" main.js manifest.json --clobber

            - name: Attest main.js
              uses: actions/attest-build-provenance@v1
              with:
                  subject-path: "${{ github.workspace }}/main.js"
                  subject-name: main.js

            - name: Attest manifest.json
              uses: actions/attest-build-provenance@v1
              with:
                  subject-path: "${{ github.workspace }}/manifest.json"
                  subject-name: manifest.json

            - name: Verify release asset attestations
              run: |
                  gh attestation verify main.js --repo "${{ github.repository }}"
                  gh attestation verify manifest.json --repo "${{ github.repository }}"
