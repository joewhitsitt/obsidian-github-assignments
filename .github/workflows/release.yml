name: Release

on:
    push:
        tags:
            - "*.*.*"

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"
            - run: npm ci
            - run: npm run build

            - name: Upload release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release upload "$tag" main.js manifest.json --clobber

            - name: Attest release assets
              run: |
                  gh attestation create main.js manifest.json --predicate-type https://slsa.dev/provenance/v1 --signing-repo "${{ github.repository }}"
                  gh attestation verify main.js manifest.json --repo "${{ github.repository }}" --format minimal
